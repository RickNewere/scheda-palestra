name: Build Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Copies dist into the native project and regenerates the pieces that
      # are not tracked (cordova plugins folder, capacitor config).
      - run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3

      - name: Restore signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p android/keystore
          # The secret may carry CRLF from a Windows shell, base64 -d chokes on it.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/keystore/release.jks
          password=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d '\r\n')
          alias=$(printf '%s' "$KEY_ALIAS" | tr -d '\r\n')
          cat > android/keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$password
          keyAlias=$alias
          keyPassword=$password
          EOF
          keytool -list -keystore android/keystore/release.jks -storepass "$password" >/dev/null && echo "keystore ok"

      - name: Build APK
        working-directory: android
        env:
          # Tag v1.2.3 becomes versionName 1.2.3, the run number keeps
          # versionCode always going up.
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '1.0' }}
        run: ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }} -PversionName=${VERSION_NAME#v}

      - name: Collect APK
        run: |
          found=$(find android/app/build/outputs/apk -name '*.apk' | head -n 1)
          cp "$found" scheda-palestra.apk
          ls -lh scheda-palestra.apk

      - uses: actions/upload-artifact@v4
        with:
          name: scheda-palestra-apk
          path: scheda-palestra.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: scheda-palestra.apk
          generate_release_notes: true
